<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020617"/>
      <stop offset="50%" style="stop-color:#0c1222"/>
      <stop offset="100%" style="stop-color:#1a0a2e"/>
    </linearGradient>
    <linearGradient id="node" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f5ff"/>
      <stop offset="100%" style="stop-color:#bf00ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff6b00;stop-opacity:1"/>
      <stop offset="40%" style="stop-color:#bf00ff;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#00f5ff;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="960" height="360" fill="url(#bg)"/>
  <g stroke="#00f5ff" stroke-opacity="0.25" stroke-width="1" fill="none">
    <line x1="120" y1="180" x2="300" y2="100"/><line x1="120" y1="180" x2="300" y2="180"/><line x1="120" y1="180" x2="300" y2="260"/>
    <line x1="300" y1="100" x2="480" y2="80"/><line x1="300" y1="100" x2="480" y2="140"/><line x1="300" y1="180" x2="480" y2="140"/><line x1="300" y1="180" x2="480" y2="220"/><line x1="300" y1="260" x2="480" y2="220"/><line x1="300" y1="260" x2="480" y2="280"/>
    <line x1="480" y1="80" x2="660" y2="120"/><line x1="480" y1="140" x2="660" y2="120"/><line x1="480" y1="140" x2="660" y2="180"/><line x1="480" y1="220" x2="660" y2="180"/><line x1="480" y1="220" x2="660" y2="240"/><line x1="480" y1="280" x2="660" y2="240"/>
    <line x1="660" y1="120" x2="840" y2="180"/><line x1="660" y1="180" x2="840" y2="180"/><line x1="660" y1="240" x2="840" y2="180"/>
    <line x1="200" y1="60" x2="400" y2="100" stroke="#bf00ff" stroke-opacity="0.2"/>
    <line x1="400" y1="300" x2="700" y2="260" stroke="#bf00ff" stroke-opacity="0.2"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="120" cy="180" r="10" fill="url(#node)"/>
    <circle cx="300" cy="100" r="8" fill="#00f5ff"/><circle cx="300" cy="180" r="12" fill="url(#node)"/><circle cx="300" cy="260" r="8" fill="#bf00ff"/>
    <circle cx="480" cy="80" r="7" fill="#00f5ff"/><circle cx="480" cy="140" r="14" fill="url(#core)"/><circle cx="480" cy="220" r="11" fill="url(#node)"/><circle cx="480" cy="280" r="7" fill="#bf00ff"/>
    <circle cx="660" cy="120" r="9" fill="#00f5ff"/><circle cx="660" cy="180" r="13" fill="url(#node)"/><circle cx="660" cy="240" r="9" fill="#bf00ff"/>
    <circle cx="840" cy="180" r="11" fill="url(#node)"/>
    <circle cx="200" cy="60" r="5" fill="#39ff14" opacity="0.8"/><circle cx="700" cy="300" r="5" fill="#ff00aa" opacity="0.8"/>
    <circle cx="400" cy="50" r="4" fill="#00f5ff" opacity="0.6"/><circle cx="550" cy="320" r="4" fill="#bf00ff" opacity="0.6"/>
  </g>
  <circle cx="480" cy="140" r="40" fill="url(#core)" opacity="0.35"/>
  <circle cx="300" cy="180" r="30" fill="#00f5ff" opacity="0.08"/>

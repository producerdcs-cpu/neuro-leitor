# NeuroLeitor — CI guardião (simples e seguro)
# Roda em todo push e pull_request.
# Deploy Vercel (opcional) só na main se secrets existirem.
# Health check da API de produção (Render) na main.
# Railway removido (legado).
#
# Nota: o contexto `secrets` NÃO pode ser usado em `if:` de steps/jobs
# (erro: "Unrecognized named-value: 'secrets'"). Solução: mapear para `env` no job.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # ─────────────────────────────────────────
  # 1. Frontend: instalar + typecheck + build
  # ─────────────────────────────────────────
  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Sem package-lock.json no repo → não usar cache: npm (exige lockfile)
          # cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Build PWA
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'http://localhost:3001' }}

      - name: Upload dist (artefato)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist
          retention-days: 3

  # ─────────────────────────────────────────
  # 2. Backend: instalar + smoke test local
  # ─────────────────────────────────────────
  backend:
    name: Backend (smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package.json

      - name: Install dependencies
        run: npm install

      - name: Start API + health check
        run: |
          node index.js &
          SERVER_PID=$!
          sleep 2
          curl -sf http://127.0.0.1:3001/api/health || (kill $SERVER_PID; exit 1)
          kill $SERVER_PID || true
        env:
          PORT: 3001
          HOST: 127.0.0.1
          NODE_ENV: test
          CORS_ORIGIN: http://localhost:5173
          OCR_PROVIDER: local
          ASR_PROVIDER: local
          CORRECTION_PROVIDER: local

  # ─────────────────────────────────────────
  # 3. Deploy Frontend (Vercel) — só main + opcional
  # ─────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend (Vercel)
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        if: env.VERCEL_TOKEN != ''
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ env.VERCEL_TOKEN }}
          vercel-org-id: ${{ env.VERCEL_ORG_ID }}
          vercel-project-id: ${{ env.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./

      - name: Skip (sem secrets)
        if: env.VERCEL_TOKEN == ''
        run: echo "⚠️ VERCEL_TOKEN não configurado — deploy frontend pulado (Vercel Git integration continua funcionando)."

  # ─────────────────────────────────────────
  # 4. Health check produção (Render) — só main
  # ─────────────────────────────────────────
  production-health:
    name: Production Health (Render)
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Check API health
        run: |
          echo "Verificando health da API de produção (Render)..."
          for i in 1 2 3 4 5; do
            if curl -sf --max-time 15 https://neuro-leitor.onrender.com/api/health; then
              echo ""
              echo "✅ Health OK"
              exit 0
            fi
            echo "Tentativa $i falhou — aguardando cold start..."
            sleep 8
          done
          echo "⚠️ Health check falhou após várias tentativas (possível cold start prolongado no free tier)."
          exit 0
